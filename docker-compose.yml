version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: gupta-sales-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - gupta-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gupta-sales-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/gupta-sales?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - gupta-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gupta-sales-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gupta-network

volumes:
  mongodb_data:

networks:
  gupta-network:
    driver: bridge